name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    name: Build & publish release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up JDK 21
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4

      - name: Build uber jar
        run: ./gradlew :melody-sync-desktop:packageUberJarForCurrentOS

      - name: Generate checksums
        run: |
          cd melody-sync-desktop/build/compose/jars
          for f in *.jar; do sha256sum "$f" > "$f.sha256"; done

      - name: Verify version matches tag
        run: |
          VERSION="$(grep -E '^melodySyncVersion=' gradle.properties | cut -d= -f2- | tr -d '[:space:]')"
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          if [ "$VERSION" != "$TAG_VERSION" ]; then
            echo "melodySyncVersion ($VERSION) does not match tag ($GITHUB_REF_NAME)" >&2
            exit 1
          fi

      - name: Create GitHub release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: melody-sync-desktop/build/compose/jars/*
          generate_release_notes: true
          # Tags like v0.13.0-dev / v0.14.0-beta / v0.14.0-rc are pre-releases.
          prerelease: ${{ contains(github.ref_name, '-dev') || contains(github.ref_name, '-beta') || contains(github.ref_name, '-rc') || contains(github.ref_name, '-alpha') || contains(github.ref_name, '-preview') }}
