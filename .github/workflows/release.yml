name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    name: Build & publish release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK 21
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      - name: Build uber jar
        run: ./gradlew :melody-sync-desktop:packageUberJarForCurrentOS

      - name: Generate checksums
        run: |
          cd melody-sync-desktop/build/compose/jars
          for f in *.jar; do sha256sum "$f" > "$f.sha256"; done

      - name: Verify version matches tag
        run: |
          VERSION="$(grep -E '^melodySyncVersion=' gradle.properties | cut -d= -f2- | tr -d '[:space:]')"
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          if [ "$VERSION" != "$TAG_VERSION" ]; then
            echo "melodySyncVersion ($VERSION) does not match tag ($GITHUB_REF_NAME)" >&2
            exit 1
          fi

      - name: Create GitHub release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: melody-sync-desktop/build/compose/jars/*
          generate_release_notes: true
          # Tags like v0.13.0-dev / v0.14.0-beta / v0.14.0-rc are pre-releases.
          prerelease: ${{ contains(github.ref_name, '-dev') || contains(github.ref_name, '-beta') || contains(github.ref_name, '-rc') || contains(github.ref_name, '-alpha') || contains(github.ref_name, '-preview') }}
